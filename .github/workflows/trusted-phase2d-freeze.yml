name: Trusted Phase 2D freeze gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-phase2d-freeze-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-phase2d-freeze-gate:
    name: trusted-phase2d-freeze-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danny0971haha/multi-venue-grid-engine
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove the checkout is the running workflow commit
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test -n "$TRUSTED_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"

      - name: Classify the pull request from trusted workflow code
        id: classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance/phase2d-trusted-gate.mjs

      - name: Enforce exact Phase 2D candidate integrity
        id: enforce
        if: steps.classify.outputs.mode == 'PHASE2D_ENFORCE'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
        run: node scripts/governance/phase2d-trusted-freeze-check.mjs

      - name: Enforce exact Phase 2E candidate integrity
        id: phase2e_integrity
        if: steps.classify.outputs.mode == 'PHASE2E_ENFORCE'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/governance/phase2e-trusted-freeze-check.mjs

      - name: Preserve trusted Phase 2E runner outside the workspace
        if: steps.classify.outputs.mode == 'PHASE2E_ENFORCE' && steps.phase2e_integrity.outcome == 'success'
        env:
          TRUSTED_STASH: ${{ runner.temp }}/trusted-governance
        run: |
          mkdir -p "$TRUSTED_STASH/scripts" "$TRUSTED_STASH/trusted"
          cp -R scripts/governance/. "$TRUSTED_STASH/scripts/"
          cp -R .github/trusted/. "$TRUSTED_STASH/trusted/"

      - name: Check out the exact Phase 2E candidate HEAD after trusted classification
        if: steps.classify.outputs.mode == 'PHASE2E_ENFORCE' && steps.phase2e_integrity.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danny0971haha/multi-venue-grid-engine
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pinned Node.js for Phase 2E runtime commands
        if: steps.classify.outputs.mode == 'PHASE2E_ENFORCE' && steps.phase2e_integrity.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Verify pinned toolchain
        if: steps.classify.outputs.mode == 'PHASE2E_ENFORCE' && steps.phase2e_integrity.outcome == 'success'
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"

      - name: Run trusted Phase 2E runtime commands
        id: phase2e_runtime
        if: steps.classify.outputs.mode == 'PHASE2E_ENFORCE' && steps.phase2e_integrity.outcome == 'success'
        env:
          TRUSTED_PHASE2E_BASELINE: ${{ runner.temp }}/trusted-governance/trusted/phase2e-corrective3-baseline.json
          PHASE2E_CANDIDATE_ROOT: ${{ github.workspace }}
          PHASE2E_EVIDENCE_PATH: ${{ runner.temp }}/phase2e-gate-evidence.json
          TRUSTED_PHASE2E_RUNNER: ${{ runner.temp }}/trusted-governance/scripts/phase2e-trusted-runtime.mjs
        run: node "$TRUSTED_PHASE2E_RUNNER"

      - name: Upload Phase 2E gate evidence
        if: always() && steps.classify.outputs.mode == 'PHASE2E_ENFORCE'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase2e-trusted-gate-evidence
          path: ${{ runner.temp }}/phase2e-gate-evidence.json
          if-no-files-found: warn

      - name: Record the stable required context result
        if: always()
        env:
          MODE: ${{ steps.classify.outputs.mode }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          PHASE2E_INTEGRITY_OUTCOME: ${{ steps.phase2e_integrity.outcome }}
          PHASE2E_RUNTIME_OUTCOME: ${{ steps.phase2e_runtime.outcome }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "trustedPhase2dFreezeGateExecuted=true"
          echo "trustedPhase2dFreezeGateMode=$MODE"
          echo "trustedGovernanceCodeIdentity=$TRUSTED_WORKFLOW_SHA"
          echo "candidateHeadSha=$PR_HEAD_SHA"
          echo "governanceCandidateAccepted=false"
          echo "phase2eRuntimeAccepted=false"
          if [ "$MODE" = "PHASE2D_ENFORCE" ] && [ "$ENFORCE_OUTCOME" != "success" ]; then
            exit 1
          fi
          if [ "$MODE" = "PHASE2E_ENFORCE" ]; then
            if [ "$PHASE2E_INTEGRITY_OUTCOME" != "success" ]; then
              exit 1
            fi
            if [ "$PHASE2E_RUNTIME_OUTCOME" != "success" ]; then
              exit 1
            fi
          fi
          case "$MODE" in
            PHASE2D_ENFORCE|PHASE2E_ENFORCE|NOT_APPLICABLE|GOVERNANCE_REVIEW_REQUIRED) ;;
            *) exit 1 ;;
          esac
