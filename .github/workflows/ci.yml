name: Phase 0 CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - experiment/v0.1-phase1
      - experiment/v0.1-phase2

permissions:
  contents: read

concurrency:
  group: phase0-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean install, static checks, tests, secret scan, and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_NATIVE_LOG_PACKET_ID: run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-job-${{ github.job }}
      SOURCE_HEAD: 4ead28400903ad6c62616835aa9459f67c6d8cd9
      SOURCE_TREE: 3a10f7645b30a33f27ecde824c16e0e36cacae6c
      HISTORICAL_ORIGINAL_LOG: NOT_OBTAINED
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record implementation checkpoint
        run: echo "implementationCheckpoint=PHASE_2D_CORRECTIVE_4_EVIDENCE_CORRECTIVE_1"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
          node --version
          npm --version

      - name: CI native log retention tool tests
        run: node --test --test-reporter=tap scripts/ci-native-log-retention/ci-native-log-retention.test.mjs

      - name: Clean install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Verify immutable candidate evidence bytes
        run: npm run verify:candidate-evidence

      - name: Tests
        run: npm test

      - name: Offline integration and fresh-process reload
        run: node scripts/ci-native-log-retention/capture.mjs -- npm run test:offline-integration

      - name: Phase 2E halt and reload tests
        run: npm run test:phase2e

      - name: Build
        run: npm run build

      - name: Secret scan
        run: npm run scan:secrets

      - name: Dry-run
        run: npm run dry-run

      - name: Generate Phase 2D Corrective 4 evidence
        run: npm run evidence:phase2d-corrective4

      - name: Verify Phase 2D Corrective 4 evidence independently
        run: npm run evidence:phase2d-corrective4:verify

      - name: Upload Phase 2D Corrective 4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-venue-phase2d-c4-v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/phase2d-corrective4/
          if-no-files-found: error
          retention-days: 90

      - name: Finalize CI native log packet
        if: always()
        run: node scripts/ci-native-log-retention/finalize.mjs

      - name: Upload CI native log packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-native-log-retention-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/ci-native-log-retention/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-job-${{ github.job }}/
          if-no-files-found: error
          retention-days: 90
